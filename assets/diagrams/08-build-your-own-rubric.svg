<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" role="img" aria-labelledby="title desc">
<title id="title">A simple five-point scoring rubric</title><desc id="desc">Example rows for tone and accuracy, plus an automatic failure row.</desc>
<style>:root{--ink:#183b56;--line:#607080;--head:#dfeaf3;--panel:#f6f8fa;--amber:#fff4dd;--red:#fde7e7}@media(prefers-color-scheme:dark){:root{--ink:#e6edf3;--line:#9baabd;--head:#23364a;--panel:#1f2937;--amber:#4a3610;--red:#4b2020}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.cell{stroke:var(--line);stroke-width:3}.h{font-size:18px;font-weight:700}.b{font-size:17px}</style>
<rect class="cell" x="25" y="25" width="220" height="55" rx="14" fill="var(--head)"/><text class="h" x="135" y="59" text-anchor="middle">Scoring area</text><g class="h" fill="var(--head)"><rect class="cell" x="245" y="25" width="110" height="55"/><rect class="cell" x="355" y="25" width="110" height="55"/><rect class="cell" x="465" y="25" width="110" height="55"/><rect class="cell" x="575" y="25" width="110" height="55"/><rect class="cell" x="685" y="25" width="110" height="55"/></g><text class="h" x="300" y="59" text-anchor="middle">1</text><text class="h" x="410" y="59" text-anchor="middle">2</text><text class="h" x="520" y="59" text-anchor="middle">3</text><text class="h" x="630" y="59" text-anchor="middle">4</text><text class="h" x="740" y="59" text-anchor="middle">5</text>
<g class="b"><rect class="cell" x="25" y="80" width="220" height="65" fill="var(--panel)"/><text x="135" y="120" text-anchor="middle">Tone</text><rect class="cell" x="245" y="80" width="550" height="65" fill="var(--panel)"/><text x="520" y="120" text-anchor="middle">Unhelpful to clear and natural</text><rect class="cell" x="25" y="145" width="220" height="65" fill="var(--panel)"/><text x="135" y="185" text-anchor="middle">Accuracy</text><rect class="cell" x="245" y="145" width="550" height="65" fill="var(--panel)"/><text x="520" y="185" text-anchor="middle">Unsupported to fully supported</text><rect class="cell" x="25" y="235" width="220" height="65" rx="14" fill="var(--red)"/><text x="135" y="274" text-anchor="middle">Automatic failure</text><rect class="cell" x="245" y="235" width="550" height="65" rx="14" fill="var(--red)"/><text x="520" y="274" text-anchor="middle">Invented commitment, date or customer intent</text></g>
</svg>
